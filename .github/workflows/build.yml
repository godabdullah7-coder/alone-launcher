name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q -o "alone-launcher (1).zip"

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & Install cargo-apk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          cargo install cargo-apk

      - name: Fix lib.rs entry point
        run: |
          cat > alone-launcher/app/src/lib.rs << 'EOF'
          mod app;
          pub use app::App;

          #[cfg(target_os = "android")]
          #[no_mangle]
          fn android_main(app: winit::platform::android::activity::AndroidApp) {
              use winit::platform::android::EventLoopBuilderExtAndroid;
              android_logger::init_once(
                  android_logger::Config::default().with_max_level(log::LevelFilter::Info),
              );
              let root = app
                  .internal_data_path()
                  .unwrap_or_else(|| std::path::PathBuf::from("/data/local/tmp"));
              let mut options = eframe::NativeOptions::default();
              options.event_loop_builder = Some(Box::new(move |builder| {
                  builder.with_android_app(app);
              }));
              let _ = eframe::run_native(
                  "ALONE LAUNCHER",
                  options,
                  Box::new(move |cc| Ok(Box::new(App::new(cc, root)))),
              );
          }
          EOF

      - name: Build Android APK
        run: |
          cd alone-launcher/app
          cargo apk build --release --target aarch64-linux-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alone-Launcher-APK
          path: alone-launcher/app/target/release/apk/*.apk
          
