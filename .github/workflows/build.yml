name: Build APK
on:
  push:
    paths-ignore:
      - '.github/workflows/inspect-pojav.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          Z=$(ls alone-v*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$Z" ]; then Z="alone-launcher (1).zip"; fi
          echo "Using: $Z"
          unzip -q "$Z"

      - name: Fix lib.rs
        run: |
          cat > alone-launcher/app/src/lib.rs << 'EOF'
          mod app;
          pub use app::App;

          #[cfg(target_os = "android")]
          #[no_mangle]
          fn android_main(app: winit::platform::android::activity::AndroidApp) {
              use winit::platform::android::EventLoopBuilderExtAndroid;
              android_logger::init_once(
                  android_logger::Config::default().with_max_level(log::LevelFilter::Info),
              );
              let root = app
                  .internal_data_path()
                  .unwrap_or_else(|| std::path::PathBuf::from("/data/local/tmp"));
              let mut options = eframe::NativeOptions::default();
              options.event_loop_builder = Some(Box::new(move |builder| {
                  builder.with_android_app(app);
              }));
              let _ = eframe::run_native(
                  "ALONE LAUNCHER",
                  options,
                  Box::new(move |cc| Ok(Box::new(App::new(cc, root)))),
              );
          }
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk || true

      - name: Make signing key
        run: |
          keytool -genkey -v -keystore $HOME/alone.jks -alias alone \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass alone123 -keypass alone123 -dname "CN=ALONE"

      - name: Build release APK
        working-directory: alone-launcher/app
        env:
          CARGO_APK_RELEASE_KEYSTORE: /home/runner/alone.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: alone123
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
          cargo apk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ALONE-LAUNCHER-apk
          path: alone-launcher/app/target/release/apk/*.apk
